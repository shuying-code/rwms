<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - 库存管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f7fa; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 0 30px; height: 60px; display: flex; justify-content: space-between; align-items: center; }
        .container { display: flex; min-height: calc(100vh - 60px); }
        .sidebar { width: 220px; background: white; padding: 20px 0; }
        .menu-item { padding: 15px 25px; cursor: pointer; color: #333; text-decoration: none; display: block; }
        .menu-item:hover, .menu-item.active { background: #f0f2ff; color: #667eea; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .page-header { background: white; padding: 20px 30px; border-radius: 10px; margin-bottom: 20px; }
        .filter-bar { background: white; padding: 20px 30px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .filter-bar input, .filter-bar select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 5px; }
        .filter-bar button { padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #4caf50; color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .btn-default { background: #f5f5f5; color: #333; }
        .data-table { background: white; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        thead { background: #f5f7fa; }
        .low-stock { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>WMS 库存管理系统</h1>
        <div><span id="userName">管理员</span> | <a href="#" onclick="logout()" style="color: white;">退出</a></div>
    </div>
    <div class="container">
        <div class="sidebar">
            <a href="/index.html" class="menu-item">📊 首页</a>
            <a href="/warehouse.html" class="menu-item">🏭 仓库管理</a>
            <a href="/material.html" class="menu-item">📦 物资管理</a>
            <a href="/category.html" class="menu-item">📑 物资分类</a>
            <a href="/inorder.html" class="menu-item">📥 入库管理</a>
            <a href="/outorder.html" class="menu-item">📤 出库管理</a>
            <a href="/stock.html" class="menu-item active">📈 库存管理</a>
            <a href="/supplier.html" class="menu-item">🤝 供应商管理</a>
            <a href="/customer.html" class="menu-item">👥 客户管理</a>
        </div>
        <div class="main-content">
            <div class="page-header"><h2>库存管理</h2></div>

            <!-- 筛选栏 -->
            <div class="filter-bar">
                <input type="text" id="materialCodeFilter" placeholder="物资编号" style="width:150px;">
                <select id="warehouseFilter" style="width:150px;">
                    <option value="">全部仓库</option>
                </select>
                <input type="date" id="startDateFilter" style="width:140px;" placeholder="入库开始日期">
                <input type="date" id="endDateFilter" style="width:140px;" placeholder="入库结束日期">
                <button class="btn-primary" onclick="loadStocks()">查询</button>
                <button class="btn-default" onclick="resetFilters()">重置</button>
            </div>

            <div class="data-table">
                <table>
                    <thead>
                        <tr>
                            <th>物资编号</th>
                            <th>物资名称</th>
                            <th>仓库</th>
                            <th>当前库存</th>
                            <th>更新时间</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <tr><td colspan="5" style="text-align: center;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        let warehousesCache = [];
        window.addEventListener('load', async function() {
            if (!localStorage.getItem('token')) { window.location.href = '/login.html'; return; }
            await loadWarehouses();
            loadStocks();
        });

        async function loadWarehouses() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/warehouses?page_index=1&page_size=100', { headers: { 'Authorization': `Bearer ${token}` } });
                const json = await res.json();
                if (json.code === 200) {
                    warehousesCache = json.data || [];
                    const select = document.getElementById('warehouseFilter');
                    warehousesCache.forEach(w => {
                        select.innerHTML += `<option value="${w.warehouse_id}">${w.warehouse_code} (${w.warehouse_id})</option>`;
                    });
                }
            } catch (e) { console.error(e); }
        }

        function resetFilters() {
            document.getElementById('materialCodeFilter').value = '';
            document.getElementById('warehouseFilter').value = '';
            document.getElementById('startDateFilter').value = '';
            document.getElementById('endDateFilter').value = '';
        }

        async function loadStocks() {
            try {
                const token = localStorage.getItem('token');
                const materialCode = document.getElementById('materialCodeFilter').value;
                const warehouseId = document.getElementById('warehouseFilter').value;
                const startDate = document.getElementById('startDateFilter').value;
                const endDate = document.getElementById('endDateFilter').value;

                let url = '/api/stocks?page_index=1&page_size=1000';
                if (materialCode) url += `&material_code=${encodeURIComponent(materialCode)}`;
                if (warehouseId) url += `&warehouse_id=${encodeURIComponent(warehouseId)}`;
                if (startDate) url += `&start_date=${encodeURIComponent(startDate + 'T00:00:00Z')}`;
                if (endDate) url += `&end_date=${encodeURIComponent(endDate + 'T23:59:59Z')}`;

                const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                const result = await response.json();
                if (result.code === 200) {
                    renderTable(result.data || []);
                } else {
                    document.getElementById('stockTableBody').innerHTML = `<tr><td colspan="5" style="text-align:center;">${result.msg || '加载失败'}</td></tr>`;
                }
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('stockTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center;">网络错误</td></tr>';
            }
        }

        function renderTable(stocks) {
            const tbody = document.getElementById('stockTableBody');
            if (stocks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = stocks.map(s => {
                const isLow = s.stock_num < 10;
                return `<tr>
                    <td>${s.material_id}</td>
                    <td>${s.material_name || '-'}</td>
                    <td>${s.warehouse_name || s.warehouse_id}</td>
                    <td class="${isLow ? 'low-stock' : ''}">${s.stock_num} ${isLow ? ' ⚠ 库存不足' : ''}</td>
                    <td>${s.update_time ? s.update_time.substring(0, 10) : '-'}</td>
                </tr>`;
            }).join('');
        }

        async function logout() {
            if (confirm('确定要退出登录吗？')) {
                try {
                    const token = localStorage.getItem('token');
                    await fetch('/api/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
                } catch (e) {}
                localStorage.clear();
                window.location.href = '/login.html';
            }
        }
    </script>
</body>
</html>
