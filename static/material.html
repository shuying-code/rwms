<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - 物资管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f7fa; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 0 30px; height: 60px; display: flex; justify-content: space-between; align-items: center; }
        .container { display: flex; min-height: calc(100vh - 60px); }
        .sidebar { width: 220px; background: white; padding: 20px 0; }
        .menu-item { padding: 15px 25px; cursor: pointer; color: #333; text-decoration: none; display: block; }
        .menu-item:hover, .menu-item.active { background: #f0f2ff; color: #667eea; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .page-header { background: white; padding: 20px 30px; border-radius: 10px; margin-bottom: 20px; }
        .toolbar { display: flex; gap: 10px; margin-top: 15px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #4caf50; color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .data-table { background: white; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        thead { background: #f5f7fa; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; overflow-y: auto; }
        .modal.show { display: flex; }
        .modal-content { background: white; border-radius: 10px; padding: 30px; width: 600px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>WMS 库存管理系统</h1>
        <div><span id="userName">管理员</span> | <a href="#" onclick="logout()" style="color: white;">退出</a></div>
    </div>
    <div class="container">
        <div class="sidebar">
            <a href="/index.html" class="menu-item">📊 首页</a>
            <a href="/warehouse.html" class="menu-item">🏭 仓库管理</a>
            <a href="/material.html" class="menu-item active">📦 物资管理</a>
            <a href="/category.html" class="menu-item">📑 物资分类</a>
            <a href="/inorder.html" class="menu-item">📥 入库管理</a>
            <a href="/outorder.html" class="menu-item">📤 出库管理</a>
            <a href="/stock.html" class="menu-item">📈 库存管理</a>
            <a href="/supplier.html" class="menu-item">🤝 供应商管理</a>
            <a href="/customer.html" class="menu-item">👥 客户管理</a>
        </div>
        <div class="main-content">
            <div class="page-header">
                <h2>物资管理</h2>
                <div class="toolbar">
                    <button class="btn btn-primary" onclick="showAddModal()">+ 新增物资</button>
                </div>
            </div>
            <div class="data-table">
                <table>
                    <thead>
                        <tr>
                            <th>物资编号</th>
                            <th>物资名称</th>
                            <th>分类</th>
                            <th>单位</th>
                            <th>进价</th>
                            <th>售价</th>
                            <th>库存</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="materialTableBody">
                        <tr><td colspan="8" style="text-align: center;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="materialModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">新增物资</h3>
            <form id="materialForm">
                <input type="hidden" id="materialId">
                <div class="form-group">
                    <label>物资编号 *</label>
                    <input type="text" id="materialCode" required placeholder="如: WZ000001">
                </div>
                <div class="form-group">
                    <label>物资名称 *</label>
                    <input type="text" id="materialName" required>
                </div>
                <div class="form-group">
                    <label>物资分类 *</label>
                    <select id="categoryId" required>
                        <option value="">请选择分类</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>单位 *</label>
                    <input type="text" id="unit" required placeholder="如: 个/根/件">
                </div>
                <div class="form-group">
                    <label>进价 *</label>
                    <input type="number" step="0.01" id="purchasePrice" required>
                </div>
                <div class="form-group">
                    <label>售价 *</label>
                    <input type="number" step="0.01" id="sellPrice" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal()" style="background: #999; color: white;">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            if (!localStorage.getItem('token')) {
                window.location.href = '/login.html';
                return;
            }
            loadMaterials();
            loadCategories();
        });

        async function loadMaterials() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/materials', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                if (result.code === 200) {
                    renderTable(result.data || []);
                }
            } catch (error) {
                console.error('加载失败:', error);
            }
        }

        async function loadCategories() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/categories', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                
                if (result.code === 200) {
                    const select = document.getElementById('categoryId');
                    select.innerHTML = '<option value="">请选择物资分类</option>';
                    
                    if (result.data && result.data.length > 0) {
                        result.data.forEach(cat => {
                            const option = document.createElement('option');
                            option.value = cat.category_id;
                            option.textContent = cat.category_name;
                            select.appendChild(option);
                        });
                    }
                }
            } catch (error) {
                console.error('加载分类失败:', error);
            }
        }

        function renderTable(materials) {
            const tbody = document.getElementById('materialTableBody');
            if (materials.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = materials.map(m => `
                <tr>
                    <td>${m.material_id}</td>
                    <td>${m.material_name}</td>
                    <td>${m.category_name || '-'}</td>
                    <td>${m.unit}</td>
                    <td>¥${m.purchase_price}</td>
                    <td>¥${m.sell_price}</td>
                    <td>${m.total_stock || 0}</td>
                    <td>
                        <button onclick="editMaterial('${m.material_id}')" style="padding: 5px 10px; margin-right: 5px;">编辑</button>
                        <button onclick="deleteMaterial('${m.material_id}')" style="padding: 5px 10px; background: #f44336; color: white;">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function showAddModal() {
            document.getElementById('modalTitle').textContent = '新增物资';
            document.getElementById('materialForm').reset();
            document.getElementById('materialId').value = '';
            document.getElementById('materialModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('materialModal').classList.remove('show');
        }

        // 表单提交处理
        document.getElementById('materialForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const materialId = document.getElementById('materialId').value;
            const data = {
                material_id: document.getElementById('materialCode').value,
                material_name: document.getElementById('materialName').value,
                category_id: parseInt(document.getElementById('categoryId').value),
                unit: document.getElementById('unit').value,
                purchase_price: parseFloat(document.getElementById('purchasePrice').value),
                sell_price: parseFloat(document.getElementById('sellPrice').value)
            };
            
            try {
                const token = localStorage.getItem('token');
                const url = materialId ? '/api/materials/update' : '/api/materials';
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    alert(materialId ? '修改成功' : '新增成功');
                    closeModal();
                    loadMaterials();
                } else {
                    alert(result.msg || '操作失败');
                }
            } catch (error) {
                console.error('保存失败:', error);
                alert('网络错误，请稍后重试');
            }
        });
        
        // 编辑物资
        async function editMaterial(materialId) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/materials/${materialId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                
                if (result.code === 200) {
                    const material = result.data;
                    
                    document.getElementById('modalTitle').textContent = '编辑物资';
                    document.getElementById('materialId').value = material.material_id;
                    document.getElementById('materialCode').value = material.material_id;
                    document.getElementById('materialName').value = material.material_name;
                    document.getElementById('categoryId').value = material.category_id;
                    document.getElementById('unit').value = material.unit;
                    document.getElementById('purchasePrice').value = material.purchase_price;
                    document.getElementById('sellPrice').value = material.sell_price;
                    
                    document.getElementById('materialModal').classList.add('show');
                } else {
                    alert(result.msg || '加载失败');
                }
            } catch (error) {
                console.error('加载详情失败:', error);
                alert('网络错误');
            }
        }
        
        // 删除物资
        async function deleteMaterial(materialId) {
            if (!confirm('确定要删除该物资吗？')) return;
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/materials/${materialId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                
                if (result.code === 200) {
                    alert('删除成功');
                    loadMaterials();
                } else {
                    alert(result.msg || '删除失败');
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('网络错误');
            }
        }

        // 退出登录
        async function logout() {
            if (confirm('确定要退出登录吗？')) {
                try {
                    const token = localStorage.getItem('token');
                    await fetch('/api/logout', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    localStorage.clear();
                    window.location.href = '/login.html';
                } catch (error) {
                    localStorage.clear();
                    window.location.href = '/login.html';
                }
            }
        }
    </script>
</body>
</html>
