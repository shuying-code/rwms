name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/rwms.exe dist/rwms-windows-x64.exe
          Copy-Item -Recurse static dist/static
          Copy-Item application.yml dist/application.yml
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/rwms-windows-x64.exe, dist/static, dist/application.yml, dist/README.md -DestinationPath dist/rwms-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: rwms-windows-x64
          path: dist/rwms-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/rwms-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build universal (arm64 + x86_64)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/rwms-macos-universal \
            target/aarch64-apple-darwin/release/rwms \
            target/x86_64-apple-darwin/release/rwms
          chmod +x dist/rwms-macos-universal
          codesign --force --sign - dist/rwms-macos-universal || true
          lipo -info dist/rwms-macos-universal
      - name: Package
        run: |
          cp -R static dist/static
          cp application.yml dist/application.yml
          cp README.md dist/README.md
          cd dist
          tar -czf rwms-macos-universal.tar.gz rwms-macos-universal static application.yml README.md
      - uses: actions/upload-artifact@v4
        with:
          name: rwms-macos-universal
          path: dist/rwms-macos-universal.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/rwms-macos-universal.tar.gz

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/rwms dist/rwms-linux-x64
          chmod +x dist/rwms-linux-x64
          cp -R static dist/static
          cp application.yml dist/application.yml
          cp README.md dist/README.md
          tar -czf dist/rwms-linux-x64.tar.gz -C dist rwms-linux-x64 static application.yml README.md
      - uses: actions/upload-artifact@v4
        with:
          name: rwms-linux-x64
          path: dist/rwms-linux-x64.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/rwms-linux-x64.tar.gz
