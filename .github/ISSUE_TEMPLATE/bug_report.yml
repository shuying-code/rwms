name: 🐞 Bug / 问题反馈
description: 报告可复现的 Bug 或异常（请尽量填写完整，便于快速定位与修复）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把信息填完整——**可复现的最小步骤与样例**能大幅加快定位和修复。

        > 维护者通常**每周集中处理 / 回复一次** issue。请勿重复提交同一问题。
        > 提交前请先阅读 [使用反馈指南](https://github.com/shuying-code/rwms/blob/main/docs/FEEDBACK.md)。

  - type: input
    id: version
    attributes:
      label: 版本 / 构建号
      placeholder: "v0.1.0 (commit xxxxxxx)"
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: 运行方式
      options:
        - 预编译可执行文件
        - 容器镜像（GHCR）
        - 从源码构建
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统与架构
      placeholder: "Windows 11 x64 / macOS 14 arm64 / Ubuntu 22.04 x64"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动服务 ...
        2. 访问 / 页面，登录 ...
        3. 执行 ...
        4. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？可附截图 / 录屏链接
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错
      description: 终端输出或日志文件（`wms.log`）片段；请脱敏
      render: shell

  - type: textarea
    id: repro_asset
    attributes:
      label: 最小复现样例（强烈建议）
      description: 相关 API 请求（方法+URL+请求体）、页面操作、最小数据
      placeholder: |
        curl -X POST http://localhost:8080/api/in-orders -H "Authorization: Bearer ..." -d '{...}'

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索现有 issue，未发现重复问题
          required: true
        - label: 我已移除密码 / Token / 隐私等敏感信息
          required: true
